plugins {
    id "com.android.application"
}

android {
    namespace "com.goodyblossom.taskflow"
    compileSdk 35

    defaultConfig {
        applicationId "com.goodyblossom.taskflow"
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        release {
            storeFile file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

tasks.register("copyReleaseApkToProjectRoot", Copy) {
    from layout.buildDirectory.file("outputs/apk/release/app-release.apk")
    into rootProject.projectDir.parentFile
    rename { "TaskFlow-release.apk" }
}

tasks.named("assembleRelease") {
    finalizedBy "copyReleaseApkToProjectRoot"
}
