<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#172033">
    <title>My App Name</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="app-shell">
      <section class="hero" aria-label="Task summary">
        <div class="hero-top">
          <div>
            <p class="eyebrow">Task Flow</p>
            <h1>Task Flow</h1>
          </div>
          <div class="score-card">
            <strong id="progressNumber">0%</strong>
            <span>done</span>
          </div>
        </div>
        <div class="progress-track">
          <span id="progressFill"></span>
        </div>
        <div class="stats">
          <div>
            <strong id="activeCount">0</strong>
            <span>Active</span>
          </div>
          <div>
            <strong id="doneCount">0</strong>
            <span>Complete</span>
          </div>
          <div>
            <strong id="totalCount">0</strong>
            <span>Total</span>
          </div>
        </div>
      </section>

      <form class="composer" id="taskForm">
        <label class="input-wrap">
          <span>+</span>
          <input id="taskInput" type="text" autocomplete="off" maxlength="90" placeholder="Add a task">
        </label>
        <button type="submit">Add</button>
      </form>

      <nav class="toolbar" aria-label="Task filters">
        <div class="filters">
          <button class="active" type="button" data-filter="all">All</button>
          <button type="button" data-filter="active">Active</button>
          <button type="button" data-filter="completed">Completed</button>
        </div>
        <button class="clear" id="clearDone" type="button" hidden>Clear</button>
      </nav>

      <section>
        <ul class="task-list" id="taskList"></ul>
        <div class="empty-state" id="emptyState">
          <h2>Fresh slate</h2>
          <p>Add one focused task to begin.</p>
        </div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
